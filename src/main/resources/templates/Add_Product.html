<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin : Add Product</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="" th:href="@{/css/Add_Product.css}" />
</head>
<body>
    <div class="form-card">
        <h2><i class="fa-solid fa-leaf"></i> Add New Product</h2>

        <form action="" th:action="@{/addingProduct}" method="post">

            <div class="field">
                <label>Product Name</label>
                <input type="text" name="pname" placeholder="e.g. Darjeeling First Flush" required>
            </div>

            <div class="field">
                <label>Product Price (₹ / kg)</label>
                <input type="text" name="pprice" placeholder="e.g. 450" required>
            </div>

            <div class="field">
                <label>Product Description</label>
                <input type="text" name="pdescription" placeholder="Short description...">
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-plus"></i> Add Product
            </button>
        </form>

        <a href="/services" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Services
        </a>
    </div>
</body>
</html>
