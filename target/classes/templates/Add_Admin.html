<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin : Add Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="" th:href="@{/css/Add_Admin.css}" />
</head>
<body>
    <div class="form-card">
        <h2><i class="fa-solid fa-user-shield"></i> Add New Admin</h2>

        <form action="" th:action="@{/addingAdmin}" method="post">

            <div class="field">
                <label>Admin Name</label>
                <input type="text" name="adminName" placeholder="Enter full name" minlength="2" required>
            </div>

            <div class="field">
                <label>Admin Email</label>
                <input type="email" name="adminEmail" placeholder="admin@example.com" required>
            </div>

            <div class="field">
                <label>Mobile Number</label>
                <input type="tel" name="adminNumber" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </div>

            <input type="hidden" name="adminPassword" value="1234" />

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-plus"></i> Add Admin
            </button>
        </form>

        <a href="/admin/services" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Services
        </a>
    </div>
</body>
</html>
