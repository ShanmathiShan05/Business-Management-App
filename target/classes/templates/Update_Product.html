<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin : Update Product</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="" th:href="@{/css/Update_Product.css}" />
</head>
<body>
    <div class="form-card">
        <h2><i class="fa-solid fa-leaf"></i> Update Product</h2>

        <form action="" th:action="@{'/updatingProduct/'+${product.pid}}" th:object="${product}">

            <input type="hidden" th:text="${product.pid}" th:value="${product.pid}" />

            <div class="field">
                <label>Product Name</label>
                <input type="text" name="pname" th:value="${product.pname}" required>
            </div>

            <div class="field">
                <label>Product Price (₹ / kg)</label>
                <input type="text" name="pprice" th:value="${product.pprice}" required>
            </div>

            <div class="field">
                <label>Description</label>
                <input type="text" name="pdescription" th:value="${product.pdescription}" placeholder="Short description...">
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>
        </form>

        <a href="/services" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Services
        </a>
    </div>
</body>
</html>
